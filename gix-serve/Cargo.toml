lints.workspace = true

[package]
name = "gix-serve"
version = "0.0.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "Serve git's smart protocol, upload-pack and receive-pack, in their stateless-RPC form for smart HTTP"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
doctest = false

[dependencies]
gix = { path = "../gix", default-features = false, features = ["revision", "sha1"] }
gix-pack = { path = "../gix-pack", default-features = false, features = ["generate", "streaming-input", "sha1"] }
gix-packetline = { path = "../gix-packetline", features = ["blocking-io"] }
bstr = { version = "1.12.0", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.20.0"
flate2 = "1.1.1"
